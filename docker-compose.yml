services:

  # ── oba-mcp MCP server (HTTP transport) ─────────────────────────────────────
  oba-mcp:
    build: ./mcp
    ports:
      # Local development only. Public deployments must use a TLS/auth gateway
      # and must not publish the MCP container directly.
      - "127.0.0.1:${OBA_MCP_PORT:-8080}:8080"
    environment:
      OBA_BASE_URL:  ${OBA_BASE_URL:-http://maglev:4000}
      OBA_API_KEY:   ${OBA_API_KEY:?OBA_API_KEY is required}
      OBA_TRANSPORT: streamable-http
      OBA_PORT:      "8080"
      OBA_HTTP_BIND_ADDR: 0.0.0.0
      OBA_HTTP_AUTH_TOKEN: ${OBA_HTTP_AUTH_TOKEN:?OBA_HTTP_AUTH_TOKEN is required}
      OBA_ALLOWED_ORIGINS: ${OBA_ALLOWED_ORIGINS:-http://localhost:3000}
      OBA_LOG:       /var/log/oba-mcp/oba-mcp.log
      OBA_CACHE:     /var/cache/oba-mcp/cache.db
      # Either variable is forwarded only when set by the operator. Prefer the
      # canonical format; the legacy alias remains available during migration.
      OBA_LOG_FORMAT:
      OBA_LOG_JSON:
    volumes:
      - oba-cache:/var/cache/oba-mcp
      - oba-logs:/var/log/oba-mcp
    restart: unless-stopped
    depends_on:
      maglev:
        condition: service_healthy
        required: false

  # ── onebusaway-mcp-ui (SvelteKit web chat UI) ────────────────────────────────
  oba-mcp-ui:
    build: ./ui
    profiles: ["ui"]
    ports:
      - "${OBA_UI_PORT:-3000}:3000"
    environment:
      # Server-only MCP connection. Do not expose this token to browsers.
      OBA_MCP_URL: http://oba-mcp:8080
      OBA_MCP_AUTH_TOKEN: ${OBA_HTTP_AUTH_TOKEN:?OBA_HTTP_AUTH_TOKEN is required}
    restart: unless-stopped
    depends_on:
      - oba-mcp

  # ── maglev (OneBusAway-compatible backend) ───────────────────────────────────
  # Replace the image/config below with your actual maglev setup.
  # If maglev runs outside Docker set OBA_BASE_URL=http://host.docker.internal:4000
  # and remove (or comment out) this service.
  maglev:
    image: ghcr.io/onebusaway/maglev:latest   # pin to a specific tag in production
    environment:
      MAGLEV_PORT: "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/where/agencies-with-coverage.json?key=test"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  oba-cache:
  oba-logs:
