name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  go-quality:
    name: Go quality and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: mcp/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ui-quality:
    name: UI quality and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  container-scan:
    name: Container build and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build MCP image
        run: docker build --tag oba-mcp:ci ./mcp
      - name: Scan MCP image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: oba-mcp:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
