<!doctype html>
<html lang="en" class="">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="%sveltekit.assets%/oba-logo.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/oba-logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1b2017" />
		%sveltekit.head%
		<script>
			// Apply saved theme before first paint to avoid flash.
			try {
				const saved = localStorage.getItem('theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (saved === 'dark' || (!saved && prefersDark)) {
					document.documentElement.classList.add('dark');
				}
			} catch {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
